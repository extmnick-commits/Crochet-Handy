name: Pattern scraper

on:
  schedule:
    # Weekly default refresh: 10 trending patterns (inputs are unset on cron).
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Pattern Niche / Topic'
        required: true
        default: 'trending'
        type: choice
        options:
          - 'trending'
          - 'seasonal'
          - 'halloween'
          - 'christmas'
          - 'thanksgiving'
          - 'valentines'
          - 'easter'
          - 'stpatricks'
          - 'amigurumi'
          - 'wearables'
          - 'blankets'
      count:
        description: 'Number of new patterns to add'
        required: true
        default: '10'
        type: string

permissions:
  contents: write

jobs:
  update-patterns:
    runs-on: ubuntu-latest
    # Secrets live in Settings → Environments → ".env" (not repository secrets).
    environment: .env
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Repository secret YOUTUBE_API_KEY is missing or empty"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is missing or empty"
            exit 1
          fi

      - name: Scrape and enrich patterns
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SEARCH_TOPIC: ${{ inputs.topic || 'trending' }}
          SCRAPE_COUNT: ${{ inputs.count || '10' }}
        run: npm run update-patterns

      - name: Commit and push seed updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/seed.ts catalog/pattern-catalog.json
          if git diff --staged --quiet; then
            echo "No changes to store/seed.ts or catalog/pattern-catalog.json"
            exit 0
          fi
          git commit -m "chore: weekly crochet pattern seed update"
          git push
