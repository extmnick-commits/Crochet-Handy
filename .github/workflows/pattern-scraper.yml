name: Pattern scraper

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-patterns:
    runs-on: ubuntu-latest
    # Secrets live in Settings → Environments → ".env" (not repository secrets).
    environment: .env
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Repository secret YOUTUBE_API_KEY is missing or empty"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is missing or empty"
            exit 1
          fi

      - name: Scrape and enrich patterns
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: npm run update-patterns

      - name: Commit and push seed updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/seed.ts
          if git diff --staged --quiet; then
            echo "No changes to store/seed.ts"
            exit 0
          fi
          git commit -m "chore: weekly crochet pattern seed update"
          git push
