# Copy these lines to ONE of:
#   %USERPROFILE%\.gradle\gradle.properties   (recommended — not inside the repo)
#   android\gradle.properties                   (only if android/ is not committed)
#
# Put the keystore file in android\app\ (e.g. upload-keystore.jks).
# If you already built on EAS: npx eas-cli@latest credentials -p android → download keystore + credentials.json
#
MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks
MYAPP_UPLOAD_KEY_ALIAS=your-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=your-store-password
MYAPP_UPLOAD_KEY_PASSWORD=your-key-password
